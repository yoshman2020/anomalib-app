[project]
name = "anomalib-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anomalib==2.5.0",
    "streamlit>=1.58.0",
    "torch==2.6.0+cu124",
]

[[tool.uv.index]]
